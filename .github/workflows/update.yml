name: Update events and specials

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (times are UTC)
  push:
    branches: [main]
    paths: [sources.yml, "scraper/**"]   # re-check right away when the site list or scraper changes
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR (reads specials posted as pictures)
        run: sudo apt-get install -y -qq tesseract-ocr > /dev/null

      - run: pip install -r requirements.txt

      - name: Check every site
        run: python -m scraper.run
        env:
          USER_AGENT: "LocalHappenings/1.0 (+https://github.com/${{ github.repository }})"

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scraper/geocache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update events and specials"
            git pull --rebase
            git push
          fi

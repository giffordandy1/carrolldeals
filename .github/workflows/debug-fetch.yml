name: Temporary page download
on:
  push:
    branches: [main]
    paths: [.github/workflows/debug-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          UA="LocalHappenings/1.0 (+https://github.com/${{ github.repository }})"
          curl -sSL -A "$UA" https://www.woodstockinn.net/specials -o debug/woodstock-specials.html
          curl -sSL -A "$UA" https://www.woodstockinn.net/events -o debug/woodstock-events.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m "Temporary page download" && git pull --rebase && git push

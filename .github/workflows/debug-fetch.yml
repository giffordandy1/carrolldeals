name: Temporary page download
on:
  push:
    branches: [main]
    paths: [.github/workflows/debug-fetch.yml, debug/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        continue-on-error: true
        shell: bash {0}
        run: |
          mkdir -p debug/pages
          UA="LocalHappenings/1.0 (+https://github.com/${{ github.repository }})"
          echo "start" > debug/results.txt
          while read -r slug url; do
            if [ -z "$slug" ]; then continue; fi
            code=$(curl -sSL -m 30 -A "$UA" -o "debug/pages/$slug.html" -w "%{http_code} %{content_type}" "$url" 2>/dev/null)
            echo "$slug $code $url" >> debug/results.txt
            sleep 1
          done < debug/urls.txt
          echo "done" >> debug/results.txt
          pip install -q beautifulsoup4 lxml
          python3 - <<'PY'
          import glob, re
          from bs4 import BeautifulSoup
          KEEP = {"href","src","data-src","class","alt","datetime","id","itemprop","itemtype","type","title","content","property","name"}
          for f in glob.glob("debug/pages/*.html"):
              raw = open(f, errors="ignore").read()
              if raw.lstrip().startswith("BEGIN:VCALENDAR"):
                  continue
              s = BeautifulSoup(raw, "lxml")
              for t in s.find_all(["script","style","noscript","iframe","svg","link"]):
                  if t.name == "script" and "ld+json" in (t.get("type") or ""):
                      continue
                  t.decompose()
              for t in s.find_all(True):
                  t.attrs = {k: v for k, v in t.attrs.items() if k in KEEP}
              out = str(s)
              out = re.sub(r"AIza[0-9A-Za-z_\-]{20,}|sk_live_[0-9A-Za-z]+|pk_live_[0-9A-Za-z]+|ghp_[0-9A-Za-z]+|xox[bap]-[0-9A-Za-z-]+|[?&](key|token|api_key|apikey)=[^\s\"'&]+", "REDACTED", out)
              open(f, "w").write(out[:2_000_000])
          PY
      - name: Save
        if: always()
        shell: bash {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debug
          git commit -m "Temporary page download"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

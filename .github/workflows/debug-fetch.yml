name: Temporary page download
on:
  push:
    branches: [main]
    paths: [.github/workflows/debug-fetch.yml, debug/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug/pages
          UA="LocalHappenings/1.0 (+https://github.com/${{ github.repository }})"
          : > debug/results.txt
          while read -r slug url; do
            [ -z "$slug" ] && continue
            r=$(curl -sSL -m 30 -A "$UA" -o "debug/pages/$slug.html" -w "%{http_code} %{url_effective} %{content_type}" "$url" 2>&1 | tail -1)
            echo "$slug $r" >> debug/results.txt
            sleep 1
          done < debug/urls.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m "Temporary page download" && git pull --rebase && git push

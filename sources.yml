# The websites to check for events and specials.
#
# Edit this file right on GitHub (click the pencil icon), then "Commit changes".
# The site updates itself within a few minutes.
#
# For each site:
#   name:     what to call it on the map (must be unique)
#   address:  street address, used to place it on the map
#   urls:     the page(s) that list events or specials, one per line starting with "-"
#
# Optional:
#   lat / lng:   exact map coordinates, if the address lookup puts it in the wrong spot
#   paused: true    stop checking this site without deleting it
#   only: Eldersburg   for a page that lists several locations' specials
#                      ("Eldersburg: Monday", "Westminster: Tuesday"), keep just this
#                      location's items plus "Both Locations" ones
#   manual:         items you type in yourself, for sites that block the checker
#                   or only post on Facebook. Each one has:
#     - title: Thirsty Thursdays
#       kind: event            (event or special)
#       when: Thursdays 7pm    (a schedule, or a date like 2026-12-05)
#       details: Live music    (optional)
#   selectors:      tell the scraper exactly which parts of the page to read
#     item:  CSS selector for each event or special block, e.g. ".event-card"
#     title: selector for the title inside that block, e.g. "h3"
#     date:  selector for the date inside that block, e.g. "time"
#
# Tip: point at a business's Events or Specials page, not its homepage.
# Lines starting with # are notes and are ignored.

sites:
  # Example (remove the # at the start of each line to use it, then change the details):
  # - name: Main Street Tavern
  #   address: 123 Main St, Westminster, MD 21157
  #   urls:
  #     - https://www.example.com/events
  #     - https://www.example.com/specials

  - name: The Local Motive
    address: 7540 Main Street, Sykesville, MD 21784
    urls:
      - https://www.localmotivesykesville.com/faqs

  - name: E W Beck's Restaurant & Pub
    address: 7565 Main Street, Sykesville, MD 21784
    urls:
      - https://ewbecks.com/sykesville-e-w-beck-s-restaurant-and-pub-e-w-beck-s-restaurant-and-pub-happy-hours-specials
      - https://ewbecks.com/sykesville-e-w-beck-s-restaurant-and-pub-e-w-beck-s-restaurant-and-pub-news-specials-events

  - name: 1623 Brewing
    address: 5975 Exchange Drive, Eldersburg, MD 21784
    urls:
      - https://1623brewing.com/1623-events/
      - https://1623brewing.com/food-menu/

  - name: Oscar's Ale House (Eldersburg)
    address: 1438 Liberty Road, Eldersburg, MD 21784
    urls:
      - https://www.oscarsalehouse.net/eldersburg
      - https://www.oscarsalehouse.net/eldersburg-specials
      - https://www.oscarsalehouse.net/eldersburg-bow

  - name: Tony Locos Bar & Restaurant
    address: 710 Lisbon Center Drive, Woodbine, MD 21797
    # Their site blocks automated checks, so these come from their homepage by hand.
    # Daily specials are posted on their Facebook page.
    manual:
      - title: Thirsty Thursdays
        kind: event
        when: Thursdays
        details: Live music on Thursdays.
        url: https://tonylocos.com/
      - title: Music & Events
        kind: event
        when: Every Saturday and Sunday
        details: Live music and events every weekend.
        url: https://tonylocos.com/

  - name: Serra Restaurant & Bar (Eldersburg)
    address: 2021 Liberty Road, Eldersburg, MD 21784
    only: Eldersburg
    urls:
      - https://www.eatdrinkserra.com/specials
      - https://www.eatdrinkserra.com/events
      - https://www.eatdrinkserra.com/live

  - name: Serra Restaurant & Bar (Westminster)
    address: 32 W Main St, Westminster, MD 21157
    only: Westminster
    urls:
      - https://www.eatdrinkserra.com/specials
      - https://www.eatdrinkserra.com/events
      - https://www.eatdrinkserra.com/live

  - name: The Woodstock Inn
    address: 1415 Woodstock Road, Woodstock, MD 21163
    urls:
      - https://www.woodstockinn.net/events
      - https://www.woodstockinn.net/specials

  - name: Amante Pizza & Pasta
    address: 21 Liberty Road, Sykesville, MD 21784
    urls:
      - https://amantepizzasykesville.com/

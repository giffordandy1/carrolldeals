      - https://ewbecks.com/sykesville-e-w-beck-s-restaurant-and-pub-e-w-beck-s-restaurant-and-pub-news-specials-events

  - name: 1623 Brewing
    address: 5975 Exchange Drive, Eldersburg, MD 21784
    urls:
      - https://1623brewing.com/1623-events/
      - https://1623brewing.com/food-menu/

  - name: Oscar's Ale House (Eldersburg)
    address: 1438 Liberty Road, Eldersburg, MD 21784
    urls:
      - https://www.oscarsalehouse.net/eldersburg
      - https://www.oscarsalehouse.net/eldersburg-specials
      - https://www.oscarsalehouse.net/eldersburg-bow

  - name: Tony Locos Bar & Restaurant
    address: 710 Lisbon Center Drive, Woodbine, MD 21797
    urls:
      - https://tonylocos.com/
